site_name: WT Knowledge Docs
site_description: A War Thunder reverse-engineering knowledge bank
repo_url: https://github.com/FURRO404/WT_KNOWLEDGE_DOCS
repo_name: FURRO404/WT_KNOWLEDGE_DOCS
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - footnotes
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - 01 Glossary: 01-glossary.md
  - 02 File formats: 02-file-formats.md
  - 03 Replays: 03-replays.md
  - 04 Localhost 8111 API: 04-localhost-8111-api.md
  - 05 Char server API: 05-char-server-api.md
  - 06 Ballistics and armor: 06-ballistics-and-armor.md
  - 07 Terrain and maps: 07-terrain-and-maps.md
  - 08 Vehicles and models: 08-vehicles-and-models.md
  - 09 Coordinates and map transforms: 09-coordinates-and-map-transforms.md
  - 10 Tooling and repos: 10-tooling-and-repos.md
  - 11 TSS API and SRE rating: 11-sre-tss-api-info.md
  - 12 Game client and launcher: 12-game-client-and-launcher.md
  - 13 Missions and battle rules: 13-missions-and-battle-rules.md
